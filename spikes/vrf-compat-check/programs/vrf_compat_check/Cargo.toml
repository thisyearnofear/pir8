[package]
name = "vrf-compat-check"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vrf_compat_check"

[package.metadata.solana]
platform-tools-version = "v1.58"

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.18.0", features = ["anchor-compat", "vrf"] }
